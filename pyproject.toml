[project]
name = "apix"
version = "1.0.0"
description = "A daily price index for Indian domestic airfares, built to official-statistics standards. SIH 2026 / SIH26056."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "statsmodels>=0.14",
    "holidays>=0.50",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
collect = [
    "playwright>=1.44",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "psycopg[binary]>=3.1",
    "statsmodels>=0.14",
    "holidays>=0.50",
]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
dashboard = ["streamlit>=1.35", "plotly>=5.22"]
dev = [
    "pytest>=8.2",
    # ruff and black are pinned to a minor line on purpose. An unpinned formatter means CI
    # installs whatever shipped this week and can fail a build over a style rule that did
    # not exist when the code was written — a red run that teaches you nothing and trains
    # you to ignore red runs.
    "ruff>=0.15,<0.16",
    "black>=26.0,<27.0",
    "pandera>=0.20,<1.0",
    "beautifulsoup4>=4.12",
    "playwright>=1.44",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["collector", "collector.sources", "index", "api"]

[tool.ruff]
line-length = 105
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",   # line length is handled by black
    "B008",   # FastAPI Depends()/Query() in defaults is the documented idiom
    "C408",   # dict(...) is idiomatic in plotly layout code
]

[tool.black]
line-length = 105
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path for the test run. Without this, `pytest` works when invoked
# as `python -m pytest` (which adds the cwd) and fails as a bare `pytest` (which does not) —
# so the suite passed on a laptop and failed in CI for a reason that had nothing to do with
# the code. Declaring it here makes both invocations behave the same.
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
