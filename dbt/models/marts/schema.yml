version: 2

models:
  - name: mart_cell_daily
    description: One row per basket cell per collection day. The index module's input.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [collection_date, origin, destination, lead_time_days]
    columns:
      - name: cheapest_fare
        description: >
          Cheapest fare that passed the quality flag. Null when the cell was unavailable —
          which is a valid, meaningful state, not a defect.
      - name: cell_available
        tests: [not_null]

  - name: mart_collection_health
    description: Daily collection health, including the robots.txt audit count.
    columns:
      - name: availability_rate
        description: >
          Share of basket cells that returned a real quote. Published alongside every index
          value; never reported separately from it.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
