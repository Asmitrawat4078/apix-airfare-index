name: Daily collection

# 02:00 IST is 20:30 UTC the previous day. GitHub cron is UTC-only, so the conversion is
# written out here rather than left for a future reader to get wrong.
#
# This schedule is the single most important line in the repository. CLAUDE.md prime
# directive #1 is that the collector runs every day without anyone watching; a missed day
# is a permanent hole, because you cannot go back and scrape what a fare was last Tuesday.
# Do not "temporarily" disable this workflow.
#
# GitHub's scheduler is best-effort and can be delayed by several minutes under load. That
# is acceptable and in fact desirable here: the basket already specifies a randomisation
# window so the collection instant is not a fixed target for anyone pricing against it.

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated sources (blank = all enabled)"
        required: false
      limit:
        description: "Only the first N cells (smoke test)"
        required: false
      dry_run:
        description: "Collect but write nothing"
        type: boolean
        default: false

concurrency:
  group: apix-collection
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[collect]"
          playwright install --with-deps chromium

      - name: Record where and when we are collecting from
        run: |
          echo "runner public IP and geography affect what Indian OTAs return."
          echo "This is logged every run so a change in behaviour can be traced to it."
          curl -s https://ipinfo.io/json || true
          echo "UTC now: $(date -u)"
          echo "IST now: $(TZ=Asia/Kolkata date)"

      - name: Collect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APIX_SCHEDULED_IST: "02:00"
        run: |
          python -m collector.run \
            --jitter \
            ${{ github.event.inputs.sources && format('--sources {0}', github.event.inputs.sources) || '' }} \
            ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Rebuild the index from everything collected so far
        if: github.event.inputs.dry_run != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m index.build --source csv --out data/index || echo "index build skipped (needs 2+ collection days)"

      - name: Commit the day's observations
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "apix-collector"
          git config user.email "actions@github.com"
          git add data/raw data/index data/collection_health.json
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "collect: $(TZ=Asia/Kolkata date +%Y-%m-%d) observations and rebuilt index"
          # Rebase before pushing. A human committing to main while the 02:00 run is in
          # flight would otherwise reject this push, and the day's observations would exist
          # only inside a finished job. You cannot re-scrape a fare, so this retries.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main and retrying"
            git pull --rebase --autostash origin main || break
            sleep $((attempt * 10))
          done
          # Failing here would be the wrong call: the rows are already in Postgres and in the
          # run artifact, and a red run over a git race would train us to ignore red runs.
          echo "::warning::could not push the day's observations after 3 attempts; they are in Postgres and in the run artifact"

      - name: Publish the run log as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-log-${{ github.run_id }}
          path: |
            data/collection_health.json
            data/raw/
          retention-days: 90
