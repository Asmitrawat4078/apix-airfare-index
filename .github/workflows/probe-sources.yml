name: Probe fare sources

# Answers a question you cannot answer from a laptop in India: what do these sites do when
# the request comes from a foreign datacentre? GitHub's runners are in Azure US, which is
# where collection actually happens, so this is the only environment whose answer counts.
#
# Run this whenever a source starts failing, before enabling a new source, and after any
# OTA re-platforms. The report is committed so the next person does not repeat the work.

on:
  # Touching .github/probe-trigger runs the probe. This exists because the probe needs to
  # be runnable by anything that can push a commit, not only by someone clicking a button
  # in the Actions UI — including an agent working through git alone.
  push:
    paths:
      - ".github/probe-trigger"
      - ".github/probe-args"
      - "scripts/probe_sources.py"
      - "collector/sources/**"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated source names (blank = all candidates)"
        required: false
      settle:
        description: "Seconds to wait for XHRs to land"
        default: "15"
      lead_days:
        description: "Departure lead time to probe with"
        default: "15"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -e ".[collect]"
          playwright install --with-deps chromium
      - name: Where is this runner
        run: curl -s https://ipinfo.io/json || true
      - name: Probe
        # Arguments come from .github/probe-args when the run was triggered by a push, and
        # from the workflow_dispatch inputs otherwise. The file exists so that anything able
        # to push a commit can steer the probe — including an agent working through git alone,
        # with no access to the Actions UI.
        run: |
          ARGS=""
          if [ -f .github/probe-args ]; then
            ARGS="$(grep -v '^#' .github/probe-args | tr '\n' ' ')"
            echo "using args from .github/probe-args: $ARGS"
          fi
          if [ -n "${{ github.event.inputs.only }}" ]; then
            ARGS="$ARGS --only ${{ github.event.inputs.only }}"
          fi
          if [ -n "${{ github.event.inputs.settle }}" ]; then
            ARGS="$ARGS --settle ${{ github.event.inputs.settle }}"
          fi
          python scripts/probe_sources.py --out data/source_probe_report.json $ARGS
      - name: Commit the report
        run: |
          git config user.name  "apix-collector"
          git config user.email "actions@github.com"
          git add data/source_probe_report.json data/probe_payload_schema*.json 2>/dev/null || git add data/source_probe_report.json
          git diff --staged --quiet || (git commit -m "probe: source availability report from a US runner" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-probe-report
          path: |
            data/source_probe_report.json
            data/probe_payload_schema*.json
